name: Inspect AppImage
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run containing the unisic-appimage artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'kevbin/unisic'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unisic-appimage
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Provide the platform libraries supplied by a desktop
        run: |
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-0t64 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libopengl0 libgl1 libegl1 libxkbcommon0
      - name: Run the bundle and report loader errors
        run: |
          for image in dist/*.AppImage; do
            chmod +x "$image"
            "$image" --appimage-extract >/dev/null
            ldd squashfs-root/usr/bin/unisic
            "$image" --appimage-extract-and-run --version
          done
